<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Notes</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/themes/vue.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'My Notes',
      repo: 'mubinsch/mdgithubpage', // optional: 'your-username/your-repo'
      loadSidebar: true,
      subMaxLevel: 2,
      coverpage: true,
      auto2top: true
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
</script>
</body>
</html>
